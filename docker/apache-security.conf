ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory "/var/www/html">
    Options -Indexes
    AllowOverride None
</Directory>

<FilesMatch "(?i)^(?:\..*|config\.json|update_log\.json|last_(?:ip|run)\.txt|initial_password\.txt|bootstrap\.php|cloudflare_api\.php|auto_update\.php|test_cron\.php)$">
    Require all denied
</FilesMatch>

<LocationMatch "(?i)/(?:\.git|\.github|data|docker|tests)(?:/|$)">
    Require all denied
</LocationMatch>
